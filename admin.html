<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Switch Admin</title><style>body{font:16px system-ui;background:#0b1220;color:#edf3ff;max-width:800px;margin:30px auto;padding:16px}section{background:#17243b;border:1px solid #34455f;border-radius:14px;padding:20px;margin:12px 0}input,button{padding:12px;border-radius:8px;font:inherit;margin:4px}input{background:#0e1a2e;color:white;border:1px solid #64748b}button{background:#3572e8;border:0;color:white;cursor:pointer}.danger{background:#aa3546}.muted{color:#b7c7de}</style><h1>Smart Switch — Private Admin</h1><p class="muted">Search exact account email. Admin releases revoke cloud credentials. Release is logged.</p><section><label>User Gmail <input id="email" type="email" placeholder="user@gmail.com"></label><button id="search">Search</button><p id="message"></p></section><div id="results"></div><script>
const $=id=>document.getElementById(id);const msg=s=>$('message').textContent=s;
async function api(url,method='GET',data){const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
async function search(){try{msg('');const email=$('email').value.trim();const data=await api('/api/admin/users?email='+encodeURIComponent(email));const root=$('results');root.replaceChildren();if(!data.found){msg('User not found');return}if(!data.devices.length){msg('Account exists; no devices');return}for(const d of data.devices){const sec=document.createElement('section'),title=document.createElement('h3'),info=document.createElement('p'),button=document.createElement('button');title.textContent=d.name;info.textContent='Device: '+d.id+' • '+(d.online?'Online':'Offline');button.textContent='Release Device';button.className='danger';button.onclick=async()=>{if(!confirm('Release '+d.name+' from '+email+'? This revokes its cloud credentials.'))return;const password=prompt('Enter your ADMIN account password to confirm');if(!password)return;try{await api('/api/admin/devices/'+encodeURIComponent(d.id)+'/release','POST',{password});msg('Device released');await search()}catch(e){msg(e.message)}};sec.append(title,info,button);root.append(sec)}}catch(e){msg(e.message)}}$('search').onclick=search;
</script></html>
